name: Synchronisation sécurisée de Dockge upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  security-events: write

concurrency:
  group: sync-upstream-dockge
  cancel-in-progress: false

env:
  UPSTREAM_REF: upstream/master
  SYNC_BRANCH: sync/upstream-master
  TRIVY_IMAGE: aquasec/trivy:0.72.0

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Récupérer la branche active de Dockge
        run: |
          git remote add upstream https://github.com/louislam/dockge.git
          git fetch upstream master --tags

      - name: Scanner les sources upstream récupérées
        run: |
          git worktree add /tmp/dockge-upstream "$UPSTREAM_REF"
          docker run --rm -v /tmp/dockge-upstream:/work -v trivy-cache:/root/.cache/ "$TRIVY_IMAGE" fs \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --format json --output /work/trivy-upstream.json /work
          docker run --rm -v /tmp/dockge-upstream:/work -v trivy-cache:/root/.cache/ "$TRIVY_IMAGE" fs \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --format sarif --output /work/trivy-upstream.sarif /work
          cp /tmp/dockge-upstream/trivy-upstream.* .
          git worktree remove /tmp/dockge-upstream --force

      - name: Publier le scan upstream dans GitHub Security
        if: always() && hashFiles('trivy-upstream.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-upstream.sarif
          category: dockge-upstream-master

      - name: Conserver le rapport upstream
        if: always() && hashFiles('trivy-upstream.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dockge-upstream-${{ github.sha }}
          path: trivy-upstream.json
          retention-days: 30

      - name: Déterminer si upstream est déjà intégré
        id: changes
        run: |
          if git merge-base --is-ancestor "$UPSTREAM_REF" origin/main; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "$UPSTREAM_REF")" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer le merge sans résolution destructive
        if: steps.changes.outputs.pending == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH" origin/main
          set +e
          git merge --no-ff "$UPSTREAM_REF" -m "Synchroniser Dockge upstream ${{ steps.changes.outputs.sha }}"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/upstream-conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signaler automatiquement un conflit upstream
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.changes.outputs.sha }}
        run: |
          title="Synchronisation Dockge upstream bloquée"
          body=$(printf "La synchronisation automatique vers \`%s\` a détecté des conflits et a été arrêtée sans choisir arbitrairement une version.\n\nFichiers concernés :\n\`\`\`\n%s\n\`\`\`\n\nAucun changement n'a été fusionné ni publié." "$UPSTREAM_SHA" "$(cat /tmp/upstream-conflicts.txt)")
          issue=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1

      - name: Publier ou actualiser la PR upstream
        if: steps.changes.outputs.pending == 'true' && steps.merge.outputs.conflict == 'false'
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.changes.outputs.sha }}
        run: |
          git push --force-with-lease origin "$SYNC_BRANCH"
          url=$(gh pr list --head "$SYNC_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Synchroniser Dockge upstream" \
              --body "Cette PR intègre automatiquement Dockge upstream jusqu’à \`$UPSTREAM_SHA\`. Elle ne sera fusionnée qu’après les contrôles TypeScript, fonctionnels, Docker et de sécurité.")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Déclencher les contrôles protégés
        if: steps.pull-request.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref "$SYNC_BRANCH"
          gh workflow run docker-pr.yml --ref "$SYNC_BRANCH"
          gh workflow run security-trivy.yml --ref "$SYNC_BRANCH"
          gh workflow run codeql.yml --ref "$SYNC_BRANCH"

      - name: Activer la fusion après tous les contrôles
        if: steps.pull-request.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: gh pr merge --auto --merge --delete-branch "$PR_URL"
