name: DNS fallback PR496 temporary autofix
on:
  push:
    branches:
      - feat/optional-registry-dns-fallback
    paths:
      - .github/workflows/dns-fallback-pr496-autofix.yml
permissions:
  contents: write
jobs:
  format-scoped-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format only five files in PR496
        run: |
          npx eslint --fix \
            backend/registry-dns-fallback.ts \
            backend/registry-dns-fallback.test.ts \
            backend/routers/watcher-router.ts \
            backend/watchers/image-watcher.ts \
            frontend/src/components/watcher/WatcherImagesTab.vue || true
      - name: Commit scoped corrections and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/registry-dns-fallback.ts backend/registry-dns-fallback.test.ts backend/routers/watcher-router.ts backend/watchers/image-watcher.ts frontend/src/components/watcher/WatcherImagesTab.vue
          git rm -- .github/workflows/dns-fallback-pr496-autofix.yml
          git commit -m "style: apply scoped DNS fallback ESLint fixes"
          git push origin HEAD:feat/optional-registry-dns-fallback
