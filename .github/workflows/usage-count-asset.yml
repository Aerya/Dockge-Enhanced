name: Compteur anonyme et notifications

on:
  schedule:
    # Prepare current AND upcoming periods before their first download.
    - cron: "17 8 * * *"
    # Reports follow French local time, including daylight-saving changes.
    - cron: "0 20 * * 1,3,6"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-count-assets
  cancel-in-progress: false

jobs:
  usage-count:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Déterminer si un rapport est nécessaire
        id: report
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          send=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_SCHEDULE" == "0 20 * * 1,3,6" ]]; then
            send=true
          fi
          echo "send=$send" >> "$GITHUB_OUTPUT"

      - name: Préparer les périodes et envoyer le rapport
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.USAGE_COUNT_DISCORD_WEBHOOK }}
          SEND_REPORT: ${{ steps.report.outputs.send }}
        run: node .github/scripts/usage-count.cjs

      - name: Conserver le relevé sans secret
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: usage-count-report
          path: ${{ runner.temp }}/usage-count-report.json
          retention-days: 90
