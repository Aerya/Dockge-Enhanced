name: Image de test Unraid

on:
  push:
    branches: [test/unraid]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TRIVY_IMAGE: aquasec/trivy:0.72.0

concurrency:
  group: unraid-test-publication
  cancel-in-progress: false

jobs:
  build-platform:
    name: Build ${{ matrix.platform }}
    if: github.ref == 'refs/heads/test/unraid' && github.repository == 'Aerya/Dockge-Enhanced'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Vérifier le template et les guides
        run: python3 extra/unraid/test_template.py

      - name: Construire sans publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: dockge-enhanced-pr:${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          pull: true

      - name: Construire le sidecar de self-update sans publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: extra/self-update-sidecar/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: dockge-enhanced-updater-pr:${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          pull: true

      - name: Vérifier le runtime Node et les modules natifs
        run: |
          tag="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /app/data \
            -v "$PWD/.github/scripts/docker-runtime-smoke.cjs:/runtime-smoke.cjs:ro" \
            --entrypoint node "dockge-enhanced-pr:$tag" /runtime-smoke.cjs
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$PWD/.github/scripts/docker-runtime-smoke.cjs:/runtime-smoke.cjs:ro" \
            --entrypoint node "dockge-enhanced-updater-pr:$tag" /runtime-smoke.cjs --runtime-only

      - name: Scanner l’image construite
        run: |
          tag="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml \
            --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "dockge-enhanced-pr:$tag"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml \
            --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "dockge-enhanced-updater-pr:$tag"

      - name: Tester le démarrage et l’endpoint de santé
        run: |
          tag="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          docker run -d --name dockge-pr-validation \
            -p 127.0.0.1:5001:5001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --tmpfs /app/data --tmpfs /opt/stacks \
            -e DOCKGE_STACKS_DIR=/opt/stacks \
            "dockge-enhanced-pr:$tag"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5001/status; then
              exit 0
            fi
            sleep 1
          done
          docker logs dockge-pr-validation
          exit 1

      - name: Nettoyer le conteneur de validation
        if: always()
        run: |
          docker stop dockge-pr-validation 2>/dev/null || true
          docker container rm dockge-pr-validation 2>/dev/null || true

      - name: Connexion au registre de test
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier uniquement les tags de test immuables
        run: |
          arch="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          docker tag "dockge-enhanced-pr:$arch" "ghcr.io/aerya/dockge-enhanced:test-unraid-${GITHUB_SHA}-$arch"
          docker push "ghcr.io/aerya/dockge-enhanced:test-unraid-${GITHUB_SHA}-$arch"

  publish:
    needs: build-platform
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publier le manifeste de test uniquement
        run: |
          docker buildx imagetools create \
            -t ghcr.io/aerya/dockge-enhanced:test-unraid \
            -t "ghcr.io/aerya/dockge-enhanced:test-unraid-${GITHUB_SHA}" \
            "ghcr.io/aerya/dockge-enhanced:test-unraid-${GITHUB_SHA}-amd64" \
            "ghcr.io/aerya/dockge-enhanced:test-unraid-${GITHUB_SHA}-arm64"
