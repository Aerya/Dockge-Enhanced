# Generated by setup-all-repo-security-automation.sh
name: Trivy security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.72.0

jobs:
  scan:
    name: Trivy filesystem and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan current revision
        run: |
          docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output /work/trivy-head.json /work || true
          docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /work/trivy-head.sarif /work || true

      - name: Scan PR base revision
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/trivy-base "$BASE_SHA"
          docker run --rm -v /tmp/trivy-base:/work "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output /work/trivy-base.json /work || true
          cp /tmp/trivy-base/trivy-base.json ./trivy-base.json
          git worktree remove /tmp/trivy-base --force

      - name: Block only new fixable HIGH/CRITICAL findings
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/trivy_compare.py regression trivy-base.json trivy-head.json

      - name: Upload SARIF
        if: always() && hashFiles('trivy-head.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3.37.3
        continue-on-error: true
        with:
          sarif_file: trivy-head.sarif
          category: trivy-filesystem
