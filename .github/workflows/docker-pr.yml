name: Validation Docker PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-platform:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire sans publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          pull: true

  build:
    name: Build linux/amd64,linux/arm64
    if: always()
    needs: build-platform
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les deux architectures
        env:
          BUILD_RESULT: ${{ needs.build-platform.result }}
        run: test "$BUILD_RESULT" = "success"
