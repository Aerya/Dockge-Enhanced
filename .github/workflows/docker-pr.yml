name: Validation Docker PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.72.0

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-platform:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construire sans publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: dockge-enhanced-pr:${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          pull: true

      - name: Construire le sidecar de self-update sans publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: extra/self-update-sidecar/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: dockge-enhanced-updater-pr:${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          pull: true

      - name: Scanner l’image construite
        run: |
          tag="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml \
            --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "dockge-enhanced-pr:$tag"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml \
            --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "dockge-enhanced-updater-pr:$tag"

      - name: Tester le démarrage et l’endpoint de santé
        run: |
          tag="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          mkdir -p /tmp/dockge-validation-stacks
          docker run -d --name dockge-pr-validation \
            -p 127.0.0.1:5001:5001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/dockge-validation-stacks:/opt/stacks \
            -e DOCKGE_STACKS_DIR=/opt/stacks \
            "dockge-enhanced-pr:$tag"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5001/status; then
              exit 0
            fi
            sleep 1
          done
          docker logs dockge-pr-validation
          exit 1

      - name: Nettoyer le conteneur de validation
        if: always()
        run: |
          docker stop dockge-pr-validation 2>/dev/null || true
          docker container rm dockge-pr-validation 2>/dev/null || true

  build:
    name: Build linux/amd64,linux/arm64
    if: always()
    needs: build-platform
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les deux architectures
        env:
          BUILD_RESULT: ${{ needs.build-platform.result }}
        run: test "$BUILD_RESULT" = "success"
