name: Intégration Home Assistant

on:
  pull_request:
    paths:
      - custom_components/**
      - tests/home_assistant/**
      - hacs.json
      - .github/workflows/home-assistant.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Installer Home Assistant pour les tests isolés
        run: python -m pip install homeassistant==2026.10.2
      - name: Tester le client HTTP, les capteurs et la configuration
        run: python -m unittest discover -s tests/home_assistant -v
