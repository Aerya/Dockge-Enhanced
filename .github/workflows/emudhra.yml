name: Régression TLS eMudhra
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emudhra-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: [{"dockerfile": "Dockerfile", "context": ".", "runtime": "node", "python": "python"}, {"dockerfile": "extra/self-update-sidecar/Dockerfile", "context": ".", "runtime": "node", "python": "python"}]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Construire sans publication ni cache antérieur
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: docker build --pull --no-cache -f "$DOCKERFILE" -t emudhra-check "$CONTEXT"
      - name: Vérifier les certificats système et le client HTTPS natif
        env:
          RUNTIME: ${{ matrix.runtime }}
          PYTHON: ${{ matrix.python }}
        run: python3 security/emudhra/check-image.py emudhra-check --runtime "$RUNTIME" --python "$PYTHON"
