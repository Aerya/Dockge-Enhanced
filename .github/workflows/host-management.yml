name: Host Management — Tests isolés
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-ts
      - run: npx eslint 'backend/hosts/*.ts' backend/agent-socket-handlers/hosts-socket-handler.ts frontend/src/components/watcher/WatcherHostsTab.vue --quiet
      - run: npx tsx --test backend/hosts/*.test.ts frontend/src/release-news.test.ts
      - run: python3 -m unittest discover -s extra/host-management -p 'test_*.py'
      - run: sudo --preserve-env=GITHUB_ACTIONS python3 extra/host-management/integration_apt.py
      - run: |
          mkdir -p "$RUNNER_TEMP/host-reports"
          python3 extra/host-management/collector.py --output "$RUNNER_TEMP/host-reports"
          HOST_TEST_REPORT="$RUNNER_TEMP/host-reports/inventory.json" npx tsx backend/hosts/ci-smoke.ts
      - run: npm run build:frontend
      - run: python3 .github/scripts/check_docs.py
