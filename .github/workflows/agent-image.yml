name: Image agent sans interface
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construire sans publier
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: agent-validation:local
      - name: Vérifier les modules natifs et le démarrage sans interface
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /app/data \
            -v "$PWD/.github/scripts/docker-runtime-smoke.cjs:/runtime-smoke.cjs:ro" \
            --entrypoint node agent-validation:local /runtime-smoke.cjs
          docker run --rm --entrypoint sh agent-validation:local -c 'test ! -e /app/frontend-dist'
          secret="$(openssl rand -hex 32)Aa!"
          echo "::add-mask::$secret"
          trap 'docker rm -f agent-validation >/dev/null 2>&1 || true' EXIT
          docker run -d --name agent-validation -p 127.0.0.1:5056:5001 \
            --tmpfs /app/data --tmpfs /opt/stacks \
            -e DOCKGE_BOOTSTRAP_USERNAME=ci-agent -e DOCKGE_BOOTSTRAP_PASSWORD="$secret" agent-validation:local
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5056/status >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5056/)" = 404
      - name: Scanner sans assouplir les contrôles
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            aquasec/trivy:0.72.0 image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 agent-validation:local
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier uniquement depuis main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-agent:${GITHUB_SHA}-${{ matrix.arch }}"
          docker tag agent-validation:local "$image"
          docker push "$image"
  manifest:
    needs: agent
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier le manifeste de l’agent
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-agent"
          docker buildx imagetools create -t "$image:latest" -t "$image:$GITHUB_SHA" \
            "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
