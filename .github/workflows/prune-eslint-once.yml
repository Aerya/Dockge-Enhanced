name: Prune ESLint suppressions once

on:
  push:
    branches:
      - feat/detailed-self-update-progress-20261006-084356

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de la branche
        uses: actions/checkout@v7
        with:
          ref: feat/detailed-self-update-progress-20261006-084356
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Recalculer exactement les suppressions ESLint
        run: npx eslint "**/*.{ts,vue}" --prune-suppressions

      - name: Supprimer ce workflow temporaire et pousser le résultat
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prune-eslint-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add eslint-suppressions.json .github/workflows/prune-eslint-once.yml

          if git diff --cached --quiet; then
            echo "Aucune modification à pousser."
            exit 0
          fi

          git commit -m "chore: prune obsolete eslint suppressions"
          git push origin HEAD:feat/detailed-self-update-progress-20261006-084356
