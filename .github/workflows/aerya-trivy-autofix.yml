# Generated by setup-all-repo-security-automation.sh
name: Trivy auto-remediation

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  TRIVY_IMAGE: aquasec/trivy:0.72.0
  FIX_BRANCH: automation/trivy-autofix

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Baseline Trivy scan
        run: |
          docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --format json --output /work/trivy-before.json /work || true

      - name: Apply safe remediations
        id: fix
        run: .github/scripts/trivy-remediate.sh

      - name: Stop when no safe change is available
        if: steps.fix.outputs.changed != '1'
        run: echo 'Aucune correction automatique sûre disponible.'

      - name: Validate project after remediation
        if: steps.fix.outputs.changed == '1'
        run: .github/scripts/validate-remediation.sh

      - name: Verify that Trivy findings decreased
        if: steps.fix.outputs.changed == '1'
        run: |
          docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --format json --output /work/trivy-after.json /work || true
          python3 .github/scripts/trivy_compare.py improvement trivy-before.json trivy-after.json

      - name: Create or update remediation PR
        if: steps.fix.outputs.changed == '1'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$FIX_BRANCH"
          git add -A
          git commit -m 'fix(security): apply automated vulnerability remediation'
          git push --force-with-lease origin "$FIX_BRANCH"
          pr_url="$(gh pr list --head "$FIX_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$FIX_BRANCH" \
              --title 'fix(security): automated Trivy remediation' \
              --body 'Automated, package-manager-native remediation. The PR is merged only after validation and after Trivy confirms that fixable HIGH/CRITICAL findings decrease.')"
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Dispatch dedicated validation on remediation branch
        if: steps.fix.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run aerya-remediation-validation.yml --ref "$FIX_BRANCH"
          sleep 10
          run_id="$(gh run list --workflow aerya-remediation-validation.yml --branch "$FIX_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run watch "$run_id" --exit-status

      - name: Enable squash auto-merge
        if: steps.fix.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
