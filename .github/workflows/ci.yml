name: CI — Vérification build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    name: TypeScript + Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Détecter une PR documentaire
        if: github.event_name == 'pull_request'
        id: docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if .github/scripts/is-docs-only.sh "$BASE_SHA" "$HEAD_SHA"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "PR documentaire : CI frontend ignorée."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR documentaire — validation légère
        if: steps.docs.outputs.docs_only == 'true'
        run: echo "Aucun fichier applicatif modifié."

      - name: Setup Node.js 22
        if: steps.docs.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        if: steps.docs.outputs.docs_only != 'true'
        run: npm ci

      - name: Vérification ESLint
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run lint

      - name: Vérification TypeScript (tsc --noEmit)
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run check-ts

      - name: Tests des reprises registry de l’ImageWatcher
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/watchers/image-watcher.test.ts

      - name: Tests de la purge automatique des images
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/watchers/auto-prune-manager.test.ts

      - name: Tests d’authentification
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/auth.test.ts

      - name: Tests du gestionnaire de fichiers restreint
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/file-manager.test.ts

      - name: Tests des garde-fous de fédération
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/federation-health.test.ts backend/agent-manager-process.test.ts backend/agent-manager.test.ts backend/socket-handlers/manage-agent-socket-handler.test.ts

      - name: Tests des prérequis de démarrage
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/start-guard.test.ts

      - name: Tests des noms affichés des stacks et de leur identité Compose
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-display-name.test.ts

      - name: Tests du garde des auto-mises à jour
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/self-update/operation-guard.test.ts

      - name: Tests du manager des auto-mises à jour
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/self-update/manager.test.ts

      - name: Tests de persistance des stacks épinglées
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-pins.test.ts

      - name: Tests des détails d’erreur du self-update
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/self-update/failure-detail.test.ts

      - name: Tests du restore-test Restic
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/watchers/backup-restore-test.test.ts

      - name: Compatibilité du runtime frontend
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/i18n-compat.test.ts

      - name: Build frontend (Vite)
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run build:frontend

      - name: Tester la comparaison des audits npm
        if: steps.docs.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: python3 -m unittest discover -s .github/scripts -p npm_audit_compare_test.py

      - name: Audit npm — refuser les nouvelles alertes HIGH/CRITICAL
        if: steps.docs.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/npm-audit-base"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          trap 'git worktree remove --force "$base_dir"' EXIT

          audit() {
            local directory="$1" report="$2" status=0
            (cd "$directory" && npm audit --json > "$report") || status=$?
            if [ "$status" -gt 1 ]; then
              echo "npm audit a échoué (code $status) pour $directory" >&2
              return 1
            fi
          }

          audit "$base_dir" "$RUNNER_TEMP/npm-audit-base.json"
          audit "$PWD" "$RUNNER_TEMP/npm-audit-head.json"
          python3 .github/scripts/npm_audit_compare.py \
            "$RUNNER_TEMP/npm-audit-base.json" "$RUNNER_TEMP/npm-audit-head.json"

      - name: Audit npm HIGH/CRITICAL (exécution manuelle)
        if: steps.docs.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: npm audit --audit-level=high

      - name: Conserver les rapports d'audit npm
        if: always() && github.event_name == 'pull_request' && steps.docs.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.sha }}
          path: ${{ runner.temp }}/npm-audit-*.json
          if-no-files-found: ignore
          retention-days: 14
