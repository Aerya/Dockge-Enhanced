name: CI — Vérification build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    name: TypeScript + Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Détecter une PR documentaire
        if: github.event_name == 'pull_request'
        id: docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if .github/scripts/is-docs-only.sh "$BASE_SHA" "$HEAD_SHA"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "PR documentaire : CI frontend ignorée."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR documentaire — validation légère
        if: steps.docs.outputs.docs_only == 'true'
        run: echo "Aucun fichier applicatif modifié."

      - name: Contrôle documentaire (README, CHANGELOG, guides)
        run: python3 .github/scripts/check_docs.py

      - name: Vérifier les icônes raster et leurs références
        run: python3 .github/scripts/check_icons.py

      - name: Vérifier le template et les guides Unraid
        run: python3 extra/unraid/test_template.py

      - name: Setup Node.js 22
        if: steps.docs.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        if: steps.docs.outputs.docs_only != 'true'
        run: npm ci

      - name: Vérification ESLint
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run lint

      - name: Vérification TypeScript (tsc --noEmit)
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run check-ts

      - name: Tests de l’historique des fichiers et de l’éditeur de variables
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-file-history.test.ts common/env-form.test.ts frontend/src/configuration-tools-ui.test.js

      - name: Tests des catalogues communautaires
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/app-catalog.test.ts backend/catalog-sources.test.ts backend/ui-preferences.test.ts frontend/src/ui-preferences.test.js

      - name: Tests des liens de ports et du nom d’hôte principal
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test common/util-common.test.ts common/port-link-settings.test.ts backend/port-link-federation.test.ts

      - name: Tests des messages traduits de l’interface
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/server-message.test.ts

      - name: Tests de récupération de la connexion Docker
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/docker-socket-recovery.test.ts

      - name: Tests des groupes de stacks multi-instances
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-group-preferences.test.ts frontend/src/stack-groups.test.ts frontend/src/stack-groups-ui.test.js

      - name: Tests du nettoyage ciblé après mise à jour
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test common/post-update-policy.test.ts backend/post-update-cleanup.test.ts backend/post-update-snapshot.test.ts

      - name: Tests natifs du terminal web
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/terminal-env.test.ts backend/container-shell.test.ts frontend/src/terminal-focus.test.ts frontend/src/console-navigation.test.ts

      - name: Tests de l’agent sans interface
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          npx tsx --test backend/agent-mode.test.ts backend/user-access.test.ts

      - name: Tests des fichiers des conteneurs
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/container-files.test.ts backend/container-instances.test.ts

      - name: Tests des chemins des exemples Compose
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test common/stack-path-examples.test.ts

      - name: Tests des transports Socket.IO de la WebUI
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/socket-connection.test.ts backend/socket-origin.test.ts

      - name: Tests de conservation et de formatage du YAML Compose
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/compose-yaml-preserve.test.ts frontend/src/compose-yaml-format.test.ts frontend/src/compose-yaml-edit.test.ts

      - name: Tests de reconnexion et de récupération Zerobyte
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/integrations/zerobyte-installer.test.ts backend/integrations/zerobyte-workflows.test.ts

      - name: Tests des limites CPU/RAM par service
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/service-resource-limits.test.ts frontend/src/service-resource-limits-ui.test.js

      - name: Tests du nom de fichier Compose des nouvelles stacks
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-compose-filename.test.ts backend/stack-compose-project-name.test.ts

      - name: Tests des mises à jour progressives par service
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/service-rollout.test.ts backend/rollout-relay.test.ts backend/rollout-recovery.test.ts backend/stack-mutation.test.ts backend/rollout-monitoring.test.ts frontend/src/rollout-relay.test.ts frontend/src/rollout-relay-ui.test.js

      - name: Tests du suivi des déploiements
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/deployment-progress.test.ts

      - name: Tests des liens de services et de leurs permissions
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/service-links.test.ts backend/stack-url-environment.test.ts backend/shared-env.test.ts frontend/src/service-links-ui.test.js

      - name: Tests de la cartographie Docker et des liens de ports
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/docker-topology.test.ts frontend/src/topology.test.ts frontend/src/topology-ui.test.js

      - name: Tests des comptes locaux et des permissions par stack
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/user-access.test.ts backend/scoped-account.test.ts frontend/src/scoped-users.test.js

      - name: Tests des préférences de présentation compacte
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/interface-density.test.ts

      - name: Tests du rendu des paramètres et des fuseaux horaires
        if: steps.docs.outputs.docs_only != 'true'
        run: node --test frontend/src/settings-context.test.js

      - name: Tests des résumés Instance et Global
        if: steps.docs.outputs.docs_only != 'true'
        run: node --test frontend/src/home-summary.test.js

      - name: Tests du compteur de conteneurs
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/container-counts.test.ts

      - name: Tests des diagnostics Compose et des corrections YAML
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test common/compose-diagnostics.test.ts backend/compose-diagnostics.test.ts frontend/src/compose-diagnostics-ui.test.ts

      - name: Tests de préparation des montages hôte
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-bind-directory.test.ts

      - name: Tests du statut des stacks détectées et adoptées
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-service-status.test.ts

      - name: Tests des reprises registry de l’ImageWatcher
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/watchers/image-watcher.test.ts backend/watchers/image-watcher-ignore.test.ts backend/watchers/image-watcher-missing-tag.test.ts backend/watchers/image-update-verification.test.ts backend/watchers/pending-image-pulls.test.ts backend/watchers/image-update-notifications.test.ts backend/watchers/default-scheduled-time.test.ts backend/watchers/stack-auto-update.test.ts frontend/src/image-update-time.test.ts

      - name: Tests du fallback DNS configurable des registries
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/registry-dns-fallback.test.ts

      - name: Tests interface et traductions DNS de secours
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/registry-dns-ui.test.ts

      - name: Tests des labels par service
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test common/compose-labels.test.ts backend/stack-clean-exit-status.test.ts backend/compose-network-namespace.test.ts backend/compose-network-repair.test.ts backend/network-restart.test.ts

      - name: Tests de la purge automatique des images
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/watchers/auto-prune-manager.test.ts backend/notification/cleanup.test.ts backend/cleanup-notification-integration.test.ts backend/docker-prune-service.test.ts backend/docker-prune-count.test.ts backend/image-prune-acceptance.test.ts

      - name: Tests d’authentification
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/auth.test.ts backend/account-security.test.ts backend/two-factor-auth.test.ts backend/two-factor-socket.test.ts backend/reset-two-factor.test.ts backend/oidc.test.ts frontend/src/oidc-redirect.test.ts

      - name: Tests du gestionnaire de fichiers restreint
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/file-manager.test.ts

      - name: Tests des garde-fous de fédération
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/federation-health.test.ts backend/agent-manager-process.test.ts backend/agent-manager.test.ts backend/socket-handlers/manage-agent-socket-handler.test.ts

      - name: Tests des modèles Compose et des agents inversés
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test common/compose-convenience.test.ts backend/reverse-agent.test.ts backend/agent-mesh.test.ts backend/agent-socket-handlers/terminal-socket-handler.test.ts backend/socket-handlers/agent-proxy-socket-handler.test.ts

      - name: Tests des prérequis de démarrage
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/start-guard.test.ts

      - name: Tests des noms affichés des stacks et de leur identité Compose
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-display-name.test.ts

      - name: Tests des conteneurs réels et des réplicas Compose
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/container-instances.test.ts frontend/src/container-lifecycle.test.ts

      - name: Tests du garde des auto-mises à jour
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/self-update/operation-guard.test.ts

      - name: Tests du manager des auto-mises à jour
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/self-update/manager.test.ts backend/self-update/sidecar-network.test.ts backend/self-update/state-mount.test.ts backend/self-update/disk-space.test.ts backend/self-update/sidecar-watch.test.ts backend/self-update/backup-flow.test.ts backend/self-update/zerobyte-backup.test.ts

      - name: Tests de persistance des stacks épinglées
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-pins.test.ts

      - name: Tests des détails d’erreur du self-update
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/self-update/failure-detail.test.ts

      - name: Tests du restore-test Restic
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/watchers/backup-restore-test.test.ts backend/watchers/restic-repository-init.test.ts backend/watchers/backup-repository-safety.test.ts backend/watchers/backup-manager.test.ts

      - name: Tests de lecture des volumes des stacks
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-volume-inspection.test.ts frontend/src/file-manager-instances.test.js

      - name: Tests des buffers et diagnostics des commandes
        if: steps.docs.outputs.docs_only != 'true'
        run: node --test extra/command-buffer.test.cjs

      - name: Tests du comptage anonyme et des rapports
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          npx tsx --test backend/anonymous-install-count.test.ts
          node --test .github/scripts/usage-count.test.cjs

      - name: Tests des ressources et de l’historique par stack
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/stack-resource-stats.test.ts backend/stack-resource-history.test.ts backend/monitoring-history.test.ts backend/watchers/monitoring-watcher.test.ts frontend/src/stack-resource-sort.test.ts

      - name: Tests de l’intégration PowerWatch
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/watchers/powerwatch-manager.test.ts backend/agent-socket-handlers/docker-socket-handler.powerwatch.test.ts frontend/src/powerwatch.test.ts frontend/src/powerwatch-i18n.test.ts

      - name: Compatibilité du runtime frontend
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/i18n-compat.test.ts

      - name: Couverture de la traduction allemande
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/german-localization.test.ts frontend/src/release-news.test.ts

      - name: Tests du rendu Markdown des README de stacks
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/stack-readme.test.ts

      - name: Tests des fuseaux de planification et des variables TZ Compose
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test backend/scheduling-timezone.test.ts backend/scheduling-integration.test.ts common/compose-timezone.test.ts backend/self-update/settings.test.ts backend/watchers/update-policy.test.ts

      - name: Tests des propositions de healthcheck par service
        if: steps.docs.outputs.docs_only != 'true'
        run: npx tsx --test frontend/src/service-healthcheck.test.ts

      - name: Build frontend (Vite)
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run build:frontend

      - name: Tester la fédération avec un agent sans interface isolé
        if: steps.docs.outputs.docs_only != 'true'
        run: node extra/test-agent-live.mjs

      - name: Tester la comparaison des audits npm
        if: steps.docs.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: python3 -m unittest discover -s .github/scripts -p npm_audit_compare_test.py

      - name: Audit npm — refuser les nouvelles alertes HIGH/CRITICAL
        if: steps.docs.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/npm-audit-base"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          trap 'git worktree remove --force "$base_dir"' EXIT

          audit() {
            local directory="$1" report="$2" status=0
            (cd "$directory" && npm audit --json > "$report") || status=$?
            if [ "$status" -gt 1 ]; then
              echo "npm audit a échoué (code $status) pour $directory" >&2
              return 1
            fi
          }

          audit "$base_dir" "$RUNNER_TEMP/npm-audit-base.json"
          audit "$PWD" "$RUNNER_TEMP/npm-audit-head.json"
          python3 .github/scripts/npm_audit_compare.py \
            "$RUNNER_TEMP/npm-audit-base.json" "$RUNNER_TEMP/npm-audit-head.json"

      - name: Audit npm HIGH/CRITICAL (exécution manuelle)
        if: steps.docs.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: npm audit --audit-level=high

      - name: Conserver les rapports d'audit npm
        if: always() && github.event_name == 'pull_request' && steps.docs.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.sha }}
          path: ${{ runner.temp }}/npm-audit-*.json
          if-no-files-found: ignore
          retention-days: 14
