# Generated by fix-security-automation-prs.sh
name: Security remediation validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/poetry.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile*'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: remediation-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ hashFiles('**/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        if: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        if: ${{ hashFiles('**/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Validate remediation
        run: .github/scripts/validate-remediation.sh

      # La détection des nouvelles régressions HIGH/CRITICAL est déjà assurée
      # par aerya-trivy.yml, qui compare la branche de la PR à sa base.
      # Ne pas rescanner ici tout l'historique avec --exit-code 1 :
      # cela bloquerait l'installation initiale sur la dette existante.
