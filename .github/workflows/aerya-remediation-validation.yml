# Generated by setup-all-repo-security-automation.sh
name: Security remediation validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile*'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Validate remediation
        run: .github/scripts/validate-remediation.sh
      - name: Trivy must not report new fixable findings
        env:
          TRIVY_IMAGE: aquasec/trivy:0.72.0
        run: |
          docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 /work
