name: Fusion automatique Dependabot

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Lire les métadonnées Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activer la fusion squash après les contrôles requis
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        # Les changements majeurs restent soumis à une validation fonctionnelle manuelle.
        # Les correctifs et versions mineures sont fusionnés après les contrôles requis.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash --delete-branch "$PR_URL"
