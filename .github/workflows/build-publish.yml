name: Publier l’image de test des comptes limités (PR 563)

on:
  push:
    branches: [test/scoped-users-563]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-test-scoped-users-563
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aerya/dockge-enhanced
  TEST_TAG: test-scoped-users-563
  TRIVY_IMAGE: aquasec/trivy:0.72.0

jobs:
  build:
    if: github.ref == 'refs/heads/test/scoped-users-563'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire l’image de test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker build --pull --platform "linux/$ARCH" \
            --build-arg BUILD_REVISION="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t "$IMAGE:$TEST_TAG-$GITHUB_SHA-$ARCH" .
      - name: Vérifier Node, SQLite et le terminal natif
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /app/data \
            -v "$PWD/.github/scripts/docker-runtime-smoke.cjs:/runtime-smoke.cjs:ro" \
            --entrypoint node "$IMAGE:$TEST_TAG-$GITHUB_SHA-$ARCH" /runtime-smoke.cjs
      - name: Refuser les vulnérabilités HIGH et CRITICAL corrigibles
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE:$TEST_TAG-$GITHUB_SHA-$ARCH"
      - name: Vérifier le démarrage et la santé
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run -d --name dockge-pr563-validation -p 127.0.0.1:5001:5001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --tmpfs /app/data --tmpfs /opt/stacks -e DOCKGE_STACKS_DIR=/opt/stacks \
            "$IMAGE:$TEST_TAG-$GITHUB_SHA-$ARCH"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5001/status; then exit 0; fi
            sleep 1
          done
          docker logs dockge-pr563-validation
          exit 1
      - name: Publier uniquement le tag de test par architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "$IMAGE:$TEST_TAG-$GITHUB_SHA-$ARCH"
      - name: Nettoyer le conteneur temporaire
        if: always()
        run: docker rm -f dockge-pr563-validation 2>/dev/null || true

  publish:
    needs: build
    if: github.ref == 'refs/heads/test/scoped-users-563'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Publier le manifeste de test AMD64 et ARM64 sans modifier latest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$TEST_TAG" -t "$IMAGE:$TEST_TAG-$GITHUB_SHA" \
            "$IMAGE:$TEST_TAG-$GITHUB_SHA-amd64" \
            "$IMAGE:$TEST_TAG-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$TEST_TAG"
