name: 🐳 Build & Publish Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "README.fr.md"
      - "*.sh"
      - ".github/workflows/sync-upstream.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.72.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  # ─── Build natif par plateforme (sans BuildKit, sans Docker Hub) ──────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔡 Image name en minuscules
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 🔑 Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Construire l’image plateforme
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.tag }} \
            .
          docker build \
            --platform ${{ matrix.platform }} \
            -f extra/self-update-sidecar/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-updater:${{ matrix.tag }} \
            .

      - name: 🔐 Refuser une image vulnérable
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml \
            --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.tag }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml \
            --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-updater:${{ matrix.tag }}"

      - name: 📤 Publier l’image plateforme validée
        run: |
          docker push ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.tag }}
          docker push ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-updater:${{ matrix.tag }}

  # ─── Merge des deux images en un manifest multi-arch ─────────────────
  merge:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔡 Image name en minuscules
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 🔑 Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Buildx (driver local, sans Docker Hub)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: 🏷️ Metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: 🔀 Créer manifest multi-arch et push
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          version=$(jq -r .version package.json)
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-updater:${version} \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-updater:amd64 \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-updater:arm64
          docker buildx imagetools create \
            "${tag_args[@]}" \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:amd64 \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:arm64
