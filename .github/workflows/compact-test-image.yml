name: Image de test interface compacte

on:
  push:
    branches: [feat/compact-ui-demo]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/aerya/dockge-enhanced
  TRIVY_IMAGE: aquasec/trivy:0.72.0

concurrency:
  group: compact-test-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Aerya/Dockge-Enhanced' && github.ref == 'refs/heads/feat/compact-ui-demo'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Construire le prototype
        run: |
          docker build --pull --platform linux/${{ matrix.arch }} \
            --build-arg BUILD_REVISION="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t "$IMAGE:test-compact-$GITHUB_SHA-${{ matrix.arch }}" .
      - name: Vérifier Node et les modules natifs
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /app/data \
            -v "$PWD/.github/scripts/docker-runtime-smoke.cjs:/runtime-smoke.cjs:ro" \
            --entrypoint node "$IMAGE:test-compact-$GITHUB_SHA-${{ matrix.arch }}" /runtime-smoke.cjs
      - name: Vérifier le démarrage et la santé
        run: |
          docker run -d --name compact-validation \
            -p 127.0.0.1:5001:5001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --tmpfs /app/data --tmpfs /opt/stacks \
            -e DOCKGE_STACKS_DIR=/opt/stacks -e DOCKGE_ANONYMOUS_INSTALL_COUNT=false \
            "$IMAGE:test-compact-$GITHUB_SHA-${{ matrix.arch }}"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5001/status; then exit 0; fi
            sleep 1
          done
          docker logs compact-validation
          exit 1
      - name: Scanner avec Trivy avant publication
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignorefile /work/.trivyignore.yaml --list-all-pkgs=false \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE:test-compact-$GITHUB_SHA-${{ matrix.arch }}"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier uniquement le tag de test immuable
        run: docker push "$IMAGE:test-compact-$GITHUB_SHA-${{ matrix.arch }}"
      - name: Nettoyer le conteneur temporaire
        if: always()
        run: docker rm -f compact-validation 2>/dev/null || true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Publier le manifeste AMD64 et ARM64 de test
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:test-compact-ui" \
            -t "$IMAGE:test-compact-$GITHUB_SHA" \
            "$IMAGE:test-compact-$GITHUB_SHA-amd64" \
            "$IMAGE:test-compact-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:test-compact-ui"
