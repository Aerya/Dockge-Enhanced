version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      npm-validated-batch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # TypeScript 7 ne peut pas encore être installé avec la dernière version
    # publiée de TypeScript-ESLint (contrainte actuelle : TypeScript < 6.1).
    # Les versions mineures et correctives restent suivies automatiquement.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Ces majeures changent leurs API publiques et exigent une migration
      # applicative dédiée. Leurs patchs et mineures restent automatisés.
      - dependency-name: "express"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/express"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "promisify-child-process"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "croner"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "jwt-decode"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:05"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      docker-validated-batch:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:10"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      actions-validated-batch:
        patterns:
          - "*"
